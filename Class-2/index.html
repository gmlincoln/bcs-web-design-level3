<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class-2</title>
</head>

<body>

    <form action="">
        <fieldset>
            <legend>Personal Information</legend>
            <label for="">Full Name:
                <input type="text" placeholder="Full Name">
            </label>

            <br>
            <br>

            <label for="">Email:
                <input type="email" placeholder="abc@example.com">
            </label>

            <br>
            <br>

            <label for="">Date of Birth:

                <input type="date" name="" id="">

            </label>

            <br>
            <br>

            <label for="">Gender:
                <input type="radio" name="gender"> Male
                <input type="radio" name="gender" id=""> Female
            </label>

            <br>
            <br>

            <label for="">Favourite Sports:
                <input type="checkbox" name="sports" id="">Cricket
                <input type="checkbox" name="sports" id="">Football
                <input type="checkbox" name="sports" id="">Hockey
            </label>

            <br>
            <br>

            <label for="">Age:
                <input type="number" name="" id="" min="1" max="13">
            </label>

            <br>
            <br>

            <label for="">Upload Your Image:
                <input type="file" name="" id="">
            </label>

            <br>
            <br>

            <label for="">Country:
                <select name="" id="">
                    <option value="">Select Your Country</option>
                    <option value="">Bangladesh</option>
                    <option value="">USA</option>
                    <option value="">UK</option>
                    <option value="">Finland</option>
                    <option value="">Russia</option>
                </select>

            </label>


            <br>
            <br>

            <label for=""> Message:
                <textarea name="" id="" rows="10" cols="20"></textarea>
            </label>


            <br>
            <br>

            <label for="">Password:
                <input type="password" name="" id="" placeholder="Password">
            </label>



            <br>
            <br>

            <label for="">Confirm Password:
                <input type="password" name="" id="">
            </label>

            <br>
            <br>
            <input type="reset" value="Reset">
            <input type="submit" value="Submit">
        </fieldset>

    </form>

    <!-- Alt + L + O -->

</body>

</html>
